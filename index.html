<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">TaskFlow 🚀</h1>

        <!-- Formulário para Criar Tarefa -->
        <form id="taskForm" class="mb-8 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Título da Tarefa</label>
                <input type="text" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Descrição</label>
                <textarea id="description" required rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                Adicionar Tarefa
            </button>
        </form>

        <!-- Lista de Tarefas -->
        <div>
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Tarefas Cadastradas</h2>
            <div id="taskList" class="space-y-3">
                <p class="text-gray-500 text-center">Carregando tarefas...</p>
            </div>
        </div>
    </div>

    <!-- JavaScript para Consumir a API Python -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        const taskForm = document.getElementById("taskForm");
        const taskList = document.getElementById("taskList");

        async function fetchTasks() {
            try {
                const response = await fetch(`${API_URL}/tasks`);
                const data = await response.json();
                
                taskList.innerHTML = "";

                if (data.tasks.length === 0) {
                    taskList.innerHTML = `<p class="text-gray-500 text-center">Nenhuma tarefa encontrada.</p>`;
                    return;
                }

                data.tasks.forEach(task => {
                    const taskCard = document.createElement("div");
                    taskCard.className = "p-4 border rounded-md shadow-sm bg-gray-50 flex justify-between items-center";
                    taskCard.innerHTML = `
                        <div>
                            <h3 class="font-bold text-gray-800">${task.title}</h3>
                            <p class="text-sm text-gray-600">${task.description}</p>
                        </div>
                        <span class="px-2 py-1 text-xs font-semibold rounded bg-yellow-100 text-yellow-800">
                            ${task.status}
                        </span>
                    `;
                    taskList.appendChild(taskCard);
                });
            } catch (error) {
                console.error("Erro ao buscar tarefas:", error);
                taskList.innerHTML = `<p class="text-red-500 text-center">Erro ao conectar com o servidor Python.</p>`;
            }
        }

        taskForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description, status: "Pendente" })
                });

                if (response.ok) {
                    taskForm.reset();
                    fetchTasks();
                } else {
                    alert("Erro ao criar tarefa.");
                }
            } catch (error) {
                console.error("Erro na requisição POST:", error);
                alert("Erro ao conectar com o back-end.");
            }
        });

        fetchTasks();
    </script>
</body>
</html>
